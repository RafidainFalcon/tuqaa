<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b0630"/>
      <stop offset="100%" stop-color="#5b0b3a"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1b6b"/>
      <stop offset="100%" stop-color="#ff8fb1"/>
    </linearGradient>
    <radialGradient id="discShine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="heartA" d="M50 88 L16.7 55.6 C7.2 46.1 7.2 30.9 16.7 21.4 C26.2 11.9 41.4 11.9 50.9 21.4 L50 22.3 L49.1 21.4 C58.6 11.9 73.8 11.9 83.3 21.4 C92.8 30.9 92.8 46.1 83.3 55.6 Z"/>
  </defs>

  <rect width="600" height="600" fill="url(#bgA)"/>

  <!-- Vinyl record -->
  <circle cx="300" cy="300" r="270" fill="#0d0518"/>
  <g fill="none" stroke="#ffd700" stroke-opacity="0.35" stroke-width="2">
    <circle cx="300" cy="300" r="250"/>
    <circle cx="300" cy="300" r="228"/>
    <circle cx="300" cy="300" r="206"/>
    <circle cx="300" cy="300" r="184"/>
    <circle cx="300" cy="300" r="162"/>
    <circle cx="300" cy="300" r="140"/>
    <circle cx="300" cy="300" r="118"/>
  </g>
  <circle cx="300" cy="300" r="270" fill="url(#discShine)"/>

  <!-- Center label -->
  <circle cx="300" cy="300" r="96" fill="url(#labelGrad)" stroke="#ffd700" stroke-width="4"/>
  <g transform="translate(300,278)">
    <g transform="scale(1.05) translate(-50,-50)">
      <use href="#heartA" xlink:href="#heartA" fill="#ffffff"/>
    </g>
  </g>
  <text x="300" y="368" text-anchor="middle" font-family="Tahoma, 'Segoe UI', Arial, sans-serif"
        font-size="26" font-weight="bold" fill="#ffffff" direction="rtl">أغنية حب</text>
  <circle cx="300" cy="300" r="9" fill="#0d0518"/>

  <!-- Music notes -->
  <g fill="#ffd700" font-family="Georgia, 'Segoe UI Symbol', serif">
    <text x="150" y="170" font-size="46">♪</text>
    <text x="430" y="180" font-size="38">♫</text>
    <text x="450" y="440" font-size="42">♩</text>
    <text x="140" y="440" font-size="36">♬</text>
  </g>
</svg>
